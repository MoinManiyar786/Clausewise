[project]
name = "clausewise"
version = "1.0.0"
description = "GenAI assistant that makes legal documents understandable for everyday people."
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "pypdf>=4.0,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
